name: Challenge contract
on:
  push:
  pull_request:
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate contract and scorer
        run: |
          python3 -m unittest discover -s tests -v
          python3 harness/check_contract.py
          python3 -m py_compile harness/*.py scripts/*.py
